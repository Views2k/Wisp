version: 2

multi-ecosystem-groups:
  build-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: nuget
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: build-dependencies

  - package-ecosystem: dotnet-sdk
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: build-dependencies
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: build-dependencies
