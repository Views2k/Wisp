name: CI

on:
  workflow_dispatch:
    inputs:
      capture_ui:
        description: Capture and upload UI review screenshots
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-plan:
    name: Choose validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      baseline: ${{ steps.plan.outputs.baseline }}
      evidence: ${{ steps.plan.outputs.evidence }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify published baseline and changed inputs
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = ./.github/scripts/Get-CiValidationPlan.ps1 | ConvertFrom-Json
          if ($plan.mode -notin @('full', 'docs-only')) { throw 'Invalid validation plan.' }
          "mode=$($plan.mode)" >> $env:GITHUB_OUTPUT
          "baseline=$($plan.baselineCommit)" >> $env:GITHUB_OUTPUT
          "evidence=$($plan.baselineRunUrl)" >> $env:GITHUB_OUTPUT
          "$($plan.mode): $($plan.reason)" >> $env:GITHUB_STEP_SUMMARY
          if ($plan.mode -eq 'docs-only') {
            "Previous full validation: $($plan.baselineRunUrl) at $($plan.baselineCommit). No new installer will be built." >> $env:GITHUB_STEP_SUMMARY
          }

  test:
    name: Build and test
    if: always()
    needs: validation-plan
    runs-on: ${{ needs.validation-plan.outputs.mode == 'docs-only' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Require a successful validation plan
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
        run: |
          if ($env:PLAN_RESULT -ne 'success' -or $env:PLAN_MODE -notin @('full', 'docs-only')) {
            throw 'Validation planning failed; this required check cannot pass.'
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository policy
        shell: pwsh
        run: ./.github/scripts/Test-RepositoryPolicy.ps1

      - name: Validate release tag provenance
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseTag.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Validate manual release-candidate provenance
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Manual installer validation must be dispatched from main.'
          }
          $head = @(& git rev-parse --verify 'HEAD^{commit}')
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1) {
            throw 'The checked-out release candidate could not be resolved.'
          }
          $main = @(& git rev-parse --verify 'refs/remotes/origin/main^{commit}')
          if ($LASTEXITCODE -ne 0 -or $main.Count -ne 1 -or $head[0] -cne $main[0]) {
            throw 'The manual installer validation checkout is not the current main commit.'
          }

      - name: Check documentation changes
        if: needs.validation-plan.outputs.mode == 'docs-only'
        shell: pwsh
        env:
          BASELINE: ${{ needs.validation-plan.outputs.baseline }}
          EVIDENCE: ${{ needs.validation-plan.outputs.evidence }}
        run: |
          git diff --check $env:BASELINE HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Documentation whitespace validation failed.' }
          "Release content and repository policy passed. Unchanged executable inputs reuse full validation: $env:EVIDENCE" >> $env:GITHUB_STEP_SUMMARY

      - name: Install .NET SDK
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Python
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install pinned Inno Setup
        if: needs.validation-plan.outputs.mode == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          $installDirectory = Join-Path $PWD 'work\innosetup'
          $expectedHash = '4D11E8050B6185E0D49BD9E8CC661A7A59F44959A621D31D11033124C4E8A7B0'
          try {
            Invoke-WebRequest `
              -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe' `
              -OutFile $installer
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -cne $expectedHash) {
              throw 'The Inno Setup download did not match the pinned SHA-256.'
            }
            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDirectory") `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0 -or
                -not (Test-Path -LiteralPath (Join-Path $installDirectory 'ISCC.exe') -PathType Leaf)) {
              throw "Inno Setup installation failed with exit code $($process.ExitCode)."
            }
          }
          finally {
            if (Test-Path -LiteralPath $installer -PathType Leaf) {
              Remove-Item -LiteralPath $installer -Force
            }
          }

      - name: Build verified installer bundle
        if: needs.validation-plan.outputs.mode == 'full'
        shell: pwsh
        run: ./installer/Build-Installer.ps1 -InnoCompiler (Resolve-Path .\work\innosetup\ISCC.exe).Path

      - name: Capture reviewed setup wizard
        if: github.event_name == 'workflow_dispatch' && inputs.capture_ui
        run: dotnet run --project tools/Wisp.UiReview/Wisp.UiReview.csproj --configuration Release --no-build --no-restore --no-launch-profile -- --output .\work\ui-review\ci-wizard --scope wizard --step welcome --dpi 144

      - name: Upload reviewed setup wizard
        if: github.event_name == 'workflow_dispatch' && inputs.capture_ui
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-wizard-review
          path: |
            work/ui-review/ci-wizard/wizard-native-digital-baseline-144dpi-welcome.png
            work/ui-review/ci-wizard/wizard-native-digital-compact-144dpi-welcome.png
            work/ui-review/ci-wizard/wizard-native-digital-launch-144dpi-welcome.png
            work/ui-review/ci-wizard/wizard-native-digital-wide-144dpi-welcome.png
            work/ui-review/ci-wizard/review.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Capture reviewed Appearance surface
        if: github.event_name == 'workflow_dispatch' && inputs.capture_ui
        run: dotnet run --project tools/Wisp.UiReview/Wisp.UiReview.csproj --configuration Release --no-build --no-restore --no-launch-profile -- --output .\work\ui-review\ci-appearance --fixture separate-boxes --dpi 144

      - name: Upload reviewed Appearance surface
        if: github.event_name == 'workflow_dispatch' && inputs.capture_ui
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-appearance-review
          path: |
            work/ui-review/ci-appearance/separate-boxes-wide-144dpi-appearance.png
            work/ui-review/ci-appearance/review.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload candidate installer bundle
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-candidate-${{ github.sha }}
          path: outputs/Wisp-Setup-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package-review:
    name: Build installer
    if: always()
    needs: [validation-plan, test]
    runs-on: ${{ needs.validation-plan.outputs.mode == 'docs-only' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful build or documented validation reuse
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PLAN_MODE: ${{ needs.validation-plan.outputs.mode }}
          EVIDENCE: ${{ needs.validation-plan.outputs.evidence }}
        run: |
          if ($env:PLAN_RESULT -ne 'success' -or $env:TEST_RESULT -ne 'success' -or $env:PLAN_MODE -notin @('full', 'docs-only')) {
            throw 'Validation failed; this required installer check cannot pass.'
          }
          if ($env:PLAN_MODE -eq 'docs-only') {
            "Packaging inputs match the published baseline. Previous installer lifecycle verification: $env:EVIDENCE. No installer was built for this documentation change." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Check out source
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download candidate from this workflow run
        if: needs.validation-plan.outputs.mode == 'full'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download "$env:GITHUB_RUN_ID" --name "wisp-candidate-$env:GITHUB_SHA" --dir outputs
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the candidate from this workflow run.' }

      - name: Verify candidate installer bundle
        if: needs.validation-plan.outputs.mode == 'full'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = [xml](Get-Content -LiteralPath .\src\Wisp.App\Wisp.App.csproj -Raw)
          $versions = @($project.Project.PropertyGroup | Where-Object { $null -ne $_.Version })
          if ($versions.Count -ne 1 -or $versions[0].Version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'The candidate must have exactly one canonical application version.'
          }
          $version = [string]$versions[0].Version
          $fileNames = @("Wisp-Setup-$version.exe", "Wisp-Setup-$version.zip")
          $expectedNames = @($fileNames) + @($fileNames | ForEach-Object { $_ + '.sha256' })
          $actualNames = @(Get-ChildItem -LiteralPath .\outputs -Force | Select-Object -ExpandProperty Name)
          if ($actualNames.Count -ne 4 -or @(Compare-Object $expectedNames $actualNames -CaseSensitive).Count -ne 0) {
            throw 'The candidate bundle must contain exactly its EXE, ZIP and two checksums.'
          }
          foreach ($fileName in $fileNames) {
            $artifact = Join-Path .\outputs $fileName
            $checksum = [System.IO.File]::ReadAllText((Join-Path .\outputs "$fileName.sha256"))
            $match = [regex]::Match($checksum, '\A(?<hash>[a-fA-F0-9]{64}) \*' + [regex]::Escape($fileName) + '\r?\n?\z')
            if (-not $match.Success -or (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash -ine $match.Groups['hash'].Value) {
              throw "The candidate $fileName did not match its SHA-256 checksum."
            }
          }

      - name: Test installer lifecycle
        if: needs.validation-plan.outputs.mode == 'full'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath .\src\Wisp.App\Wisp.App.csproj -Raw)
          $version = @($project.Project.PropertyGroup | Where-Object { $null -ne $_.Version })[0].Version
          $installer = (Resolve-Path -LiteralPath ".\outputs\Wisp-Setup-$version.exe").Path
          ./.github/scripts/Test-InstallerLifecycle.ps1 `
            -InstallerPath $installer `
            -ExpectedVersion $version

      - name: Upload installer bundle
        if: needs.validation-plan.outputs.mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-installer-${{ github.sha }}
          path: outputs/Wisp-Setup-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: [test, package-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified installer bundle
        shell: bash
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --name "wisp-installer-$GITHUB_SHA"
          --dir outputs

      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as ET; versions = [node.text.strip() for node in ET.parse("src/Wisp.App/Wisp.App.csproj").findall("./PropertyGroup/Version")]; assert len(versions) == 1; print(versions[0])')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          display_version="${version%.0}"
          installer="outputs/Wisp-Setup-${version}.exe"
          archive="outputs/Wisp-Setup-${version}.zip"
          notes="docs/releases/Wisp-${version}-release-notes.md"
          if [ ! -f "$notes" ]; then
            notes="Wisp-${version}-release-notes.md"
          fi
          test -f "$notes"
          test -f "$installer"
          test -f "${installer}.sha256"
          test -f "$archive"
          test -f "${archive}.sha256"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Wisp ${display_version}" \
            --notes-file "$notes" \
            "$installer" \
            "$archive"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
