name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository policy
        shell: pwsh
        run: ./.github/scripts/Test-RepositoryPolicy.ps1

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Restore
        run: dotnet restore Wisp.sln --nologo --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Verify formatting
        run: dotnet format Wisp.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Test .NET projects
        run: dotnet test Wisp.sln --configuration Release --no-restore --nologo --disable-build-servers -m:1 -p:UseSharedCompilation=false

      - name: Build UI review harness
        run: dotnet build tools/Wisp.UiReview/Wisp.UiReview.csproj --configuration Release --no-restore --nologo --disable-build-servers -m:1 -p:UseSharedCompilation=false

      - name: Capture reviewed setup wizard
        run: dotnet run --project tools/Wisp.UiReview/Wisp.UiReview.csproj --configuration Release --no-build --no-restore --no-launch-profile -- --output .\work\ui-review\ci-wizard --scope wizard --step welcome --dpi 144

      - name: Upload reviewed setup wizard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-wizard-review
          path: |
            work/ui-review/ci-wizard/wizard-native-digital-baseline-144dpi-welcome.png
            work/ui-review/ci-wizard/wizard-native-digital-compact-144dpi-welcome.png
            work/ui-review/ci-wizard/wizard-native-digital-launch-144dpi-welcome.png
            work/ui-review/ci-wizard/wizard-native-digital-wide-144dpi-welcome.png
            work/ui-review/ci-wizard/review.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Capture reviewed Appearance surface
        run: dotnet run --project tools/Wisp.UiReview/Wisp.UiReview.csproj --configuration Release --no-build --no-restore --no-launch-profile -- --output .\work\ui-review\ci-appearance --fixture separate-boxes --dpi 144

      - name: Upload reviewed Appearance surface
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-appearance-review
          path: |
            work/ui-review/ci-appearance/separate-boxes-wide-144dpi-appearance.png
            work/ui-review/ci-appearance/review.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Test compatibility audit
        run: python -m unittest discover -s tools/tests -p "test_*.py" -v

  package-review:
    name: Build installer
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/V')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      WISP_PRIVATE_CANDIDATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'candidate/issue-fixes-20260911' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag provenance
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseTag.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Validate manual release-candidate provenance
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Manual installer validation must be dispatched from main.'
          }
          $head = @(& git rev-parse --verify 'HEAD^{commit}')
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1) {
            throw 'The checked-out release candidate could not be resolved.'
          }
          $main = @(& git rev-parse --verify 'refs/remotes/origin/main^{commit}')
          if ($LASTEXITCODE -ne 0 -or $main.Count -ne 1 -or $head[0] -cne $main[0]) {
            throw 'The manual installer validation checkout is not the current main commit.'
          }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.1.exe'
          $installDirectory = Join-Path $PWD 'work\innosetup'
          $expectedHash = '4D11E8050B6185E0D49BD9E8CC661A7A59F44959A621D31D11033124C4E8A7B0'
          try {
            Invoke-WebRequest `
              -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe' `
              -OutFile $installer
            if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -cne $expectedHash) {
              throw 'The Inno Setup download did not match the pinned SHA-256.'
            }
            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installDirectory") `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0 -or
                -not (Test-Path -LiteralPath (Join-Path $installDirectory 'ISCC.exe') -PathType Leaf)) {
              throw "Inno Setup installation failed with exit code $($process.ExitCode)."
            }
          }
          finally {
            if (Test-Path -LiteralPath $installer -PathType Leaf) {
              Remove-Item -LiteralPath $installer -Force
            }
          }

      - name: Build verified installer bundle
        shell: pwsh
        run: ./installer/Build-Installer.ps1 -InnoCompiler (Resolve-Path .\work\innosetup\ISCC.exe).Path

      - name: Test installer lifecycle
        timeout-minutes: 5
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath .\src\Wisp.App\Wisp.App.csproj -Raw)
          $version = @($project.Project.PropertyGroup | Where-Object { $null -ne $_.Version })[0].Version
          $installer = (Resolve-Path -LiteralPath ".\outputs\Wisp-Setup-$version.exe").Path
          ./.github/scripts/Test-InstallerLifecycle.ps1 `
            -InstallerPath $installer `
            -ExpectedVersion $version

      - name: Encrypt private review installer
        if: env.WISP_PRIVATE_CANDIDATE == 'true'
        shell: pwsh
        env:
          WISP_ARCHIVE_KEY: ${{ secrets.WISP_CANDIDATE_20260911_ARCHIVE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WISP_ARCHIVE_KEY -cnotmatch '^[0-9a-f]{64}$') {
            throw 'The private review archive key is missing or invalid.'
          }
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) {
            throw 'The required 7-Zip executable is unavailable.'
          }
          $project = [xml](Get-Content -LiteralPath .\src\Wisp.App\Wisp.App.csproj -Raw)
          $version = @($project.Project.PropertyGroup | Where-Object { $null -ne $_.Version })[0].Version
          $installerName = "Wisp-Setup-$version.exe"
          $installer = (Resolve-Path -LiteralPath (Join-Path 'outputs' $installerName)).Path
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $innerChecksum = (Get-Content -LiteralPath "$installer.sha256" -Raw).Trim()
          if ($innerChecksum -ine "$installerHash *$installerName") {
            throw 'The private review installer checksum does not match the verified bundle.'
          }
          $reviewDirectory = Join-Path $env:RUNNER_TEMP 'wisp-private-review'
          New-Item -ItemType Directory -Path $reviewDirectory -ErrorAction Stop | Out-Null
          $archiveName = "Wisp-Review-$env:GITHUB_SHA.7z"
          $archive = Join-Path $reviewDirectory $archiveName
          Push-Location (Split-Path -Parent $installer)
          try {
            & $sevenZip a -t7z -mx=0 -mhe=on "-p$env:WISP_ARCHIVE_KEY" $archive $installerName "$installerName.sha256" *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Private review archive encryption failed with exit code $LASTEXITCODE."
            }
            & $sevenZip t "-p$env:WISP_ARCHIVE_KEY" $archive *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Private review archive integrity validation failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash *$archiveName" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          [ordered]@{
            schemaVersion = 1
            sourceRevision = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            version = $version
            installerFile = $installerName
            installerSha256 = $installerHash
            archiveFile = $archiveName
            archiveSha256 = $archiveHash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $reviewDirectory 'review-manifest.json') -Encoding utf8

      - name: Upload encrypted review installer
        if: env.WISP_PRIVATE_CANDIDATE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-private-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wisp-private-review/Wisp-Review-${{ github.sha }}.7z
            ${{ runner.temp }}/wisp-private-review/Wisp-Review-${{ github.sha }}.7z.sha256
            ${{ runner.temp }}/wisp-private-review/review-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload installer bundle
        if: env.WISP_PRIVATE_CANDIDATE != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-installer-${{ github.sha }}
          path: outputs/Wisp-Setup-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: package-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified installer bundle
        shell: bash
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --name "wisp-installer-$GITHUB_SHA"
          --dir outputs

      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as ET; versions = [node.text.strip() for node in ET.parse("src/Wisp.App/Wisp.App.csproj").findall("./PropertyGroup/Version")]; assert len(versions) == 1; print(versions[0])')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          display_version="${version%.0}"
          installer="outputs/Wisp-Setup-${version}.exe"
          archive="outputs/Wisp-Setup-${version}.zip"
          notes="docs/releases/Wisp-${version}-release-notes.md"
          if [ ! -f "$notes" ]; then
            notes="Wisp-${version}-release-notes.md"
          fi
          test -f "$notes"
          test -f "$installer"
          test -f "${installer}.sha256"
          test -f "$archive"
          test -f "${archive}.sha256"
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Wisp ${display_version}" \
            --notes-file "$notes" \
            "$installer" \
            "$archive"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
